---
title: Choose a new password | BabyVibes
description: Reset the password for your BabyVibes account.
page: reset
noindex: yes
---
<section class="section">
 <div class="narrow" id="reset-wrap" style="max-width:520px">
  <div class="section-head"><span class="kicker">My account</span><h1>Choose a new password</h1></div>
  <p class="alert" id="reset-alert" role="alert" hidden></p>
  <form class="form prose" id="reset-form" novalidate>
   <div class="field"><label for="rp1">New password <span class="hint">at least 8 characters</span></label><input id="rp1" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
   <div class="field"><label for="rp2">Type it again</label><input id="rp2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
   <button class="btn btn--block" type="submit">Save my new password</button>
  </form>
 </div>
</section>
